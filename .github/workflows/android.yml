name: Android CI/CD

on:
  push:
    branches: ['**']
    tags:
      - 'ReadBound_v[0-9]+.[0-9]+'
      - 'ReadBound_v[0-9]+.[0-9]+.[0-9]+'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Test and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Run unit tests and build debug APK
        run: bash gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: ReadBound-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Publish signed APK
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build release APK
        run: bash gradlew --no-daemon :app:assembleRelease
      - name: Check release version
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#ReadBound_v}"
          if [[ "$tag_version" != *.*.* ]]; then
            tag_version="$tag_version.0"
          fi

          apk_version="$(jq -er '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)"
          if [[ "$apk_version" != "$tag_version" ]]; then
            echo "::error::Tag version $tag_version does not match APK version $apk_version"
            exit 1
          fi
          printf 'value=%s\n' "$tag_version" >> "$GITHUB_OUTPUT"
      - name: Sign and verify release APK
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"

          signing_dir="$(mktemp -d "$RUNNER_TEMP/signing.XXXXXX")"
          trap 'rm -f -- "$signing_dir/release.keystore" "$signing_dir/aligned.apk"; rmdir -- "$signing_dir"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.keystore"

          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/zipalign" -P 16 -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk "$signing_dir/aligned.apk"
          apk="ReadBound-v$RELEASE_VERSION.apk"
          "$build_tools/apksigner" sign --ks "$signing_dir/release.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD --out "$apk" "$signing_dir/aligned.apk"
          "$build_tools/apksigner" verify --verbose "$apk"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "$GITHUB_REF_NAME" "ReadBound-v$RELEASE_VERSION.apk" \
            --verify-tag --title "ReadBound v$RELEASE_VERSION" --generate-notes
